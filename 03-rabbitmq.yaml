- name: configure rabbitmq server
  hosts: rabbitmq
  become: yes
  tasks: 
  - name: copy rabbitmq repo
    copy:
     src: rabbitmq.repo
     dest: /etc/yum.repos.d/rabbitmq.reppo


  - name: Install Erlang and RabbitMQ
    ansible.builtin.dnf:
        name:
          - erlang
          - rabbitmq-server
        state: present
        update_cache: yes

  - name: start and enable rabbitmq server
    service:
     name: rabbitmq-server
     state: strted
     enabled: yes

  - name: create rabbitmq user
    community.rabbitmq.rabbitmq_user:
     user: roboshop
     password: roboshop123
     vhost: /
     configure_priv: .*
     read_priv: .*
     write_priv: .*
     state: present