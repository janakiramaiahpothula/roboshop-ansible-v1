
---
- name: Manage RoboShop EC2 and Route53
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    action: create
    aws_region: us-east-1
    domain_name: classpractice.online
    ami_id: ami-0055977a6e828a4f4
    ssh_source_ip: "223.228.102.235/32"

    instances:
      - mongodb
      - redis
      - rabbitmq

    security_groups:
      - common
      - mongodb
      - redis
      - rabbitmq
      - frontend

    sg_rules:
      - name: common
        rules:
          - proto: tcp
            ports: [22]
            cidr_ip: "{{ ssh_source_ip }}"

      - name: frontend
        rules:
          - proto: tcp
            ports: [80, 443]
            cidr_ip: 0.0.0.0/0

      - name: mongodb
        rules:
          - proto: tcp
            ports: [27017]
            group_name: roboshop-common

      - name: redis
        rules:
          - proto: tcp
            ports: [6379]
            group_name: roboshop-common

      - name: rabbitmq
        rules:
          - proto: tcp
            ports: [5672]
            group_name: roboshop-common
          - proto: tcp
            ports: [15672]
            cidr_ip: "{{ ssh_source_ip }}"

  tasks:

    - name: Create security groups
      amazon.aws.ec2_security_group:
        name: "roboshop-{{ item }}"
        description: "RoboShop {{ item }} security group"
        region: "{{ aws_region }}"
        state: present
      loop: "{{ security_groups }}"
      when: action == "create"

    - name: Configure security group rules
      amazon.aws.ec2_security_group:
        name: "roboshop-{{ item.name }}"
        description: "RoboShop {{ item.name }}"
        region: "{{ aws_region }}"
        state: present
        rules: "{{ item.rules }}"
      loop: "{{ sg_rules }}"
      when: action == "create"

    - name: Create EC2 instances
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        image_id: "{{ ami_id }}"
        instance_type: t3.micro
        region: "{{ aws_region }}"
        security_groups:
          - roboshop-common
          - "roboshop-{{ item }}"
        state: present
        wait: true
      loop: "{{ instances }}"
      register: ec2_output
      when: action == "create"

    - name: Create backend DNS records
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{ item.item }}.{{ domain_name }}"
        type: A
        ttl: 60
        value: "{{ item.instances[0].private_ip_address }}"
        overwrite: true
      loop: "{{ ec2_output.results | default([]) }}"
      when: action == "create"

    - name: Create frontend DNS record
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{ domain_name }}"
        type: A
        ttl: 60
        value: "{{ item.instances[0].public_ip_address }}"
        overwrite: true
      loop: "{{ ec2_output.results | default([]) }}"
      when:
        - action == "create"
        - item.item == "frontend"

    - name: Delete DNS records
      amazon.aws.route53:
        state: absent
        zone: "{{ domain_name }}"
        record: "{{ item }}.{{ domain_name }}"
        type: A
      loop: "{{ instances + [domain_name] }}"
      when: action == "delete"

    - name: Delete EC2 instances
      amazon.aws.ec2_instance:
        state: absent
        filters:
          "tag:Name": "roboshop-{{ item }}"
        region: "{{ aws_region }}"
        wait: true
      loop: "{{ instances }}"
      when: action == "delete"

    - name: Delete security groups
      amazon.aws.ec2_security_group:
        name: "roboshop-{{ item }}"
        state: absent
        region: "{{ aws_region }}"
      loop: "{{ security_groups | reverse | list }}"
      when: action == "delete"
