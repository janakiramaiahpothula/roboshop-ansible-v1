- name: create ec2 instances and r53 records
  hosts: local
  connection: local
  vars:
    instances: ["mongodb", "redis", "mysql"]
    action: delete
    domain_name: classpractice.online
    ami_id: ami-0055977a6e828a4f4
  tasks:
    - name: create ec2 instance
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        image_id: "{{ ami_id }}"
        instance_type: t3.micro
        security_groups: 
          - roboshop-common
          - "roboshop-{{ item }}"
        region: us-east-1
      loop: "{{ instances }}"
      when: action == "create"
      register: ec2_output

    - name: create R53 record 
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{ item.item }}.{{ domain_name }}"
        type: A
        ttl: 1
        value: "{{ item.instance.private_ip_address }}"
        overwrite: true
      loop: "{{ ec2_output.results }}"
      when: action == "create"
      
    - name: delete r53 records
      amazon.aws.route53:
        state: absent
        zone: "{{ domain_name }}"
        record: "{{ item.item }}.{{ domain_name }}"
        type: A
        value: "{{ item.instance.private_ip_address }}"
      loop: "{{ ec2_output.results }}"
      when: action == "delete"