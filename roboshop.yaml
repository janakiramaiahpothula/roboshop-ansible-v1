- name: create ec2 instance and r53 records
  hosts: local
  connection: local
  vars:
  
    instances: ["mongodb", "redis", "rabbitmq"]
    action: create
    domain_name: classpractice.online
    ami_id: ami-0055977a6e828a4f4
    security_groups: ["mongodb1", "redis1", "rabbitmq1"]
  tasks:
  - name: create ec2 instance
    amazon.aws.ec2_instance:
     name: "roboshop-{{ item }}" 
     image_id: "{{ ami_id }}"
     instance_type: t3.micro
     region: us-east-1
    loop: "{{ instances }}" 
    when: action == "create"
    register: ec2_output
  - name: create security groups for ec2 instances
    amazon.aws.ec2_security_group:
     name: "roboshop-{{ security_groups }}"
     rules:
       - proto: tcp
         from_port: 22
         to_port: 22
         cidr_ip: "0.0.0.0/0" 
         register: sg_result

  - name: Print Created Security Group ID
    ansible.builtin.debug:
        msg: "Security Group ID is {{ sg_result.group_id }}"
  
  - name: create r53 records
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}.{{ domain_name }}"
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      overwrite: yes
    loop: "{{ ec2_output.results }}"  
    when: action == "create"

  - name: create r53 record for frontend
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ domain_name }}" 
      type: A
      ttl: 1
      value: "{{ item.instances[0].public_ip_address }}"
      overwrite: true
    loop: "{{ ec2_output.results }}"
    when: action == "create"

  - name: delete r53 records
    amazon.aws.route53:
     state: absent
     zone: "{{ domain_name }}"  
     record: "{{ item }}.{{ domain_name }}"
     ttl: 1
     type: A
    loop: "{{ instances }}"
    when: action == "delete"

  - name: delete r53 records for frontend
    amazon.aws.route53:
      state: absent
      zone: "{{ domain_name }}"
      record: "{{ domain_name }}"
      ttl: 1
      type: A
    when: action == "delete" 

  - name: delete ec2 instances
    amazon.aws.ec2_instance:
      state: absent
      name: "roboshop-{{ item }}"
      region: us-east-1
      wait: false
    loop: "{{ instances }}" 
    when: action == "delete" 

