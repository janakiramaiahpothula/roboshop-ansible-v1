- name: create ec2 instance and r53 records
  hosts: local
  connection: local
  vars:
  
    instances: ["mongodb", "redis", "rabbitmq"]
    action: create
    domain_name: classpractice.online
    ami_id: ami-0055977a6e828a4f4
    security_groups: ["mongodb", "redis", "rabbitmq", "frontend"]
    ssh_source_ip: "223.228.102.235"
  tasks:
    
  - name: Create security groups for EC2 instances
    amazon.aws.ec2_security_group:
      name: "roboshop-{{ item }}"
      description: "Security group for {{ item }}"
      state: present
      region: us-east-1
    loop: "{{ security_groups }}"
    when: action == "create"

  - name: Allow SSH access
    amazon.aws.ec2_security_group:
     name: roboshop-common
     description: Common security group
     state: present
     region: us-east-1
     rules:
      - proto: tcp
        ports:
          - 22
        cidr_ip: "{{ ssh_source_ip }}"
        rule_desc: SSH from my IP

  - name: Allow frontend HTTP and HTTPS
    amazon.aws.ec2_security_group:
     name: roboshop-frontend1
     description: Frontend security group
     state: present
     region: us-east-1
     rules:
      - proto: tcp
        ports:
          - 80
          - 443
        cidr_ip: 0.0.0.0/0
        rule_desc: Public web traffic
  
  - name: Allow MongoDB access
    amazon.aws.ec2_security_group:
     name: roboshop-mongodb1
     description: MongoDB security group
     state: present
     region: us-east-1
     rules:
      - proto: tcp
        ports: 27017
        group_name: roboshop-frontend1

  - name: Allow Redis access
    amazon.aws.ec2_security_group:
     name: roboshop-redis1
     description: Redis security group
     state: present
     region: us-east-1
     rules:
      - proto: tcp
        ports: 6379
        group_name: roboshop-frontend1

  - name: Allow RabbitMQ access
    amazon.aws.ec2_security_group:
     name: roboshop-rabbitmq1
     description: RabbitMQ security group
     state: present
     region: us-east-1
     rules:
      - proto: tcp
        ports: 5672
        group_name: roboshop-frontend1
      - proto: tcp
        ports: 15672
        cidr_ip: "{{ ssh_source_ip }}"
        rule_desc: RabbitMQ management from my IP
  
  - name: create ec2 instance
    amazon.aws.ec2_instance:
     name: "roboshop-{{ item }}" 
     image_id: "{{ ami_id }}"
     instance_type: t3.micro
     region: us-east-1
     security_groups: "roboshop-{{ item }}"
    loop: "{{ instances }}" 
    when: action == "create"
    register: ec2_output

  - name: create r53 records
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}.{{ domain_name }}"
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      overwrite: yes
    loop: "{{ ec2_output.results }}"  
    when: action == "create"

  - name: create r53 record for frontend
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ domain_name }}" 
      type: A
      ttl: 1
      value: "{{ item.instances[0].public_ip_address }}"
      overwrite: true
    loop: "{{ ec2_output.results }}"
    when: action == "create"

  - name: delete r53 records
    amazon.aws.route53:
     state: absent
     zone: "{{ domain_name }}"  
     record: "{{ item }}.{{ domain_name }}"
     ttl: 1
     type: A
    loop: "{{ instances }}"
    when: action == "delete"

  - name: delete r53 records for frontend
    amazon.aws.route53:
      state: absent
      zone: "{{ domain_name }}"
      record: "{{ domain_name }}"
      ttl: 1
      type: A
    when: action == "delete" 
  
  - name: delete ec2 instances
    amazon.aws.ec2_instance:
      state: absent
      name: "roboshop-{{ item }}"
      region: us-east-1
      wait: false
    loop: "{{ instances }}" 
    when: action == "delete" 
  
  - name: Delete security groups
    amazon.aws.ec2_security_group:
        name: "{{ item }}"
        state: absent
        region: us-east-1
    loop: "{{ security_groups }}"  
