
---
- name: configure mongodb server
  hosts: local
  become: true
  tasks:
  - name: copy mongodg repo
    copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo

  - name: install mongodb server
    package:
      name: mongod
      state: present
  - name: start and enable mongod
    service:
      name: mongod
      state: started
      enable: yes
  - name: allow remote connections
    replace:
     path: /etc/mongod.conf
     regexp: '127.0.0.1'
     replace: '0.0.0.0'
  - name: restart mongod
    service:
      name: mongod    
      state: restarted
     
