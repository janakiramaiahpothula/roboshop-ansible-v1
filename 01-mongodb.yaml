- name: Configure mongodb server
  hosts: mongodb
  become: yes
  tasks:
  - name: copy mongodb repo
    copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo

  - name: install mongodb server
    package: 
     name: mongod-org
     state: present

  - name: start and enable mongodb
    service:
     name: mongod
     state: started
     enabled: yes
  - name: allow remoto coonections
    replace:
     path: /etc/mongod.conf
     regexp: '127.0.0.1'
     replace: '0.0.0.0'
  - name: restart mongod 
    service:
     name: mongod
     state: restarted   
