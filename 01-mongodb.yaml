- name: configure mongodb server
  hosts: mongodb
  become: yes
  tasks:
  - name: copy mongodg repo
    copy: 
     src: mongo.repo
     dest: /etc/yum.repos.d/mongo.repo


  - name: install mongodb server
    package:
     name: monodb-org
     state: present

  - name: start and enable mongodb
    service:
     name: mongod
     state: stareted
     enable: yes

  - name: allow remote connections
    lineinfile:
     path: /etc/monod.conf
     regexp: '127.0.0.1' 
     replace: '0.0.0.0'
  - name: restart mongodb
    service:
     name: mongod
     state: restarted
