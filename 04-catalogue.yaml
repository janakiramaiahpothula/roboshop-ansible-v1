---

- name: configure catalogue server
  hosts: catalogue
  become: yes
  tasks:
  - name: disable default module
    command: dnf moduel disable nodejs:24 -y 
  
  - name: enable nodejs module
    command: dnf module enable nodejs:24 -y

  - name: install nodejs module
    dnf:
      name: nodejs
      state: present

  - name: create roboshop system user
    user:
      name: roboshop
      create_home: false
      home: /app
      system: true
      shell: /sbin/nologin
      comment: "roboshopsystem user"

  - name: remove existing app directory
    file:
     path: /app
     state: absent

  - name: remove catlogue zip
    file: 
     path:  /tmp/catalogue.zip
     state: directory
  
  - name: Download catalogu appilication
    get_url:
     url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/catalogue-v4.zip
     dest: /tmp/catalogue.zip

  - name: Unzip catalogue 
    unarchive:
      src: /tmp/catalogue.zip
      dest: /app
      remote_src: yes

  - name: install dependecies
    community.general.npm:
     path: /app

  - name: copy catalogue service
    template:
      src: catalogue.service.j2
      dest: /etc/systemd/system/catalogue.service

  - name: copy mongo repo
    copy:
     src: mongo.repo
     dest: /etc/yum.repos.d/mongo.repo  

  - name: install mongodb client
    dnf:
     name: mongodb-mongosh
     state: present

  - name: check products loaded or not
    command: mongosh --host "{{ mongodb_host }}" --quiet --eval 'db.getSiblingDB("catalogue").products.countDocuments()'
    register: product_count

  - name: print product count
    debug:
     msg: "{{ product_count }}"

  - name: load the products
    shell: mongosh --host "{{ mongodb_host }}" < /app/db/master-data.js
    when: products_count.stdout | int == 0
  
  - name: daemon reload
    systemd_service:
    daemon_reload: true

  - name:
    service:
     name: catalogue
     state: restarted
     enabled: yes  


